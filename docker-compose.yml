services:
  postgres:
    image: postgres:16-alpine
    container_name: n5deal-postgres
    environment:
      POSTGRES_USER: n5deal
      POSTGRES_PASSWORD: n5deal
      POSTGRES_DB: n5deal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
